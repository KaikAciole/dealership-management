spring:
  datasource:
    url: jdbc:h2:mem:dealershipdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

app:
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: vehicle-images
    public-base-url: http://localhost:9000

